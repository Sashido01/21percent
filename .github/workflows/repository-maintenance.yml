name: Repository maintenance

on:
  workflow_run:
    workflows: ["Repository quality"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.repository == 'Sashido01/21percent' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate maintenance safety logic
        run: python3 -m unittest discover -s scripts -p test_repository_maintenance.py -v
      - name: Create missing version tags and clean integrated branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repository_maintenance.py --apply
