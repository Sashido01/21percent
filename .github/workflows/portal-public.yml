name: Public portal availability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Public HTTPS and deployed assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify currently published portal on PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_public_portal.py --attempts 3
      - name: Verify deployment of current main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/check_public_portal.py --expect-current --attempts 40
      - name: Verify existing portal on other manually selected refs
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: python3 scripts/check_public_portal.py --attempts 3
