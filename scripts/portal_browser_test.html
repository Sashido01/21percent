<!doctype html><html lang="en"><meta charset="utf-8"><title>Portal browser test</title><body><pre id="out">RUNNING</pre><iframe id="frame" title="Portal test" width="1280" height="900" src="index.html"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('out');
const check=(c,msg)=>{if(!c)throw Error(msg);};
const tick=()=>new Promise(r=>setTimeout(r,100));
async function run(){
 const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);
 for(let i=0;i<40&&$('library-controls').hidden;i++)await tick();
 check(!$('library-controls').hidden,'app initialized');
 check($('resource-grid').children.length===7,'initial library');
 check(d.querySelector('.nav a[href="#research"]')&&d.querySelector('.nav a[href="#feed"]')&&d.querySelector('#research-catalog a[href="ruble/"]')&&d.querySelector('#research-feed a[href="ruble/"]')&&!d.querySelector('.featured-research'),'catalog and feed navigation');
 $('search').value='цифровой рубль';$('search').dispatchEvent(new w.Event('input',{bubbles:true}));check($('resource-grid').children.length===1&&$('resource-grid').querySelector('a[href="ruble/"]')&&$('resource-grid').querySelector('a[href="ruble/detail.html#question-index"]'),'ruble library search and direct links');$('clear-search').click();
 const read=d.querySelector('.reader-open');read.click();check($('reader').open&&$('reader-body').textContent.length>100,'reader content');$('reader-close').click();check(!$('reader').open,'reader close');
 check(d.querySelectorAll('.project .card-glyph').length===6,'initiative identities');
 check(!$('core-preview').hidden&&$('signal-map').dataset.module==='research','core initial');
 const core=d.querySelectorAll('button[data-module]');check(core.length===4,'core buttons');
 core[1].click();check($('signal-map').dataset.module==='practice'&&core[1].getAttribute('aria-pressed')==='true'&&core[0].getAttribute('aria-pressed')==='false','core selection');
 check($('core-title').textContent==='Практикум'&&$('core-enter').getAttribute('href')==='#practice','core preview');
 $('core-enter').click();check(w.location.hash==='#practice','core link');
 core[2].click();check($('core-enter').getAttribute('href')==='#projects','projects preview');
 $('search').value='инфляции';$('search').dispatchEvent(new w.Event('input',{bubbles:true}));
 check($('resource-grid').children.length===1&&$('resource-grid').textContent.includes('инфляции'),'search');check(d.querySelector('.resource mark')!==null,'highlight match');
 d.querySelector('[data-filter="research"]').click();check($('resource-grid').textContent.includes('Ничего не найдено'),'filter empty');
 $('clear-search').click();check($('resource-grid').children.length===7&&$('search').value===''&&$('clear-search').hidden,'clear filters');
 check($('real-rate').textContent.includes('3,7'),'real calculator initial');
 check(!$('real-chart').hidden&&parseFloat($('real-chart-nominal-bar').style.width)===100,'real chart initial');
 check(parseFloat($('real-chart-real-bar').style.width)<100&&$('real-chart').dataset.outcome==='positive','real chart proportional');
 d.querySelector('[data-real-scenario="inflation"]').click();check($('inflation').value==='20'&&$('real-chart').dataset.outcome==='negative','inflation scenario');
 d.querySelector('[data-real-scenario="base"]').click();check($('inflation').value==='8'&&$('nominal').value==='12','base scenario');
 $('nominal').value='0';$('nominal').dispatchEvent(new w.Event('input',{bubbles:true}));check($('real-rate').textContent.includes('-7,41'),'real calculator changed');
 $('inflation').value='-100';$('inflation').dispatchEvent(new w.Event('input',{bubbles:true}));check(!$('real-error').hidden&&$('real-result').hidden&&$('real-chart').hidden,'invalid input');
 $('inflation').value='8';$('inflation').dispatchEvent(new w.Event('input',{bubbles:true}));check($('real-error').hidden&&!$('real-result').hidden,'valid input restored');
 check($('reserve-months').textContent.includes('1,33'),'reserve initial');check(!$('reserve-chart').hidden&&parseFloat($('reserve-chart-before-bar').style.width)===100&&parseFloat($('reserve-chart-after-bar').style.width)<100,'reserve chart proportional');
 $('shock').value='120000';$('shock').dispatchEvent(new w.Event('input',{bubbles:true}));check($('reserve-months').textContent.startsWith('0')&&$('reserve-gap').textContent.includes('30'),'reserve deficit');check(parseFloat($('reserve-chart-after-bar').style.width)===0&&$('reserve-chart').dataset.outcome==='negative','reserve chart deficit');
 if(!$('motion-toggle').disabled){const previous=d.documentElement.dataset.motion;$('motion-toggle').click();check(d.documentElement.dataset.motion!==previous,'motion toggle');}
 d.querySelector('a[href="#practice"]').click();check(w.location.hash==='#practice','navigation');check(d.querySelector('.nav a[href="#practice"]').getAttribute('aria-current')==='location','active nav');
 check(d.documentElement.scrollWidth<=frame.clientWidth+2,'desktop overflow');
 frame.width='360';await tick();await tick();check(d.documentElement.scrollWidth<=frame.clientWidth+2,'mobile overflow');
 frame.width='320';await tick();await tick();check(d.documentElement.scrollWidth<=frame.clientWidth+2,'narrow mobile overflow');
 check($('project-grid').children.length===6,'project catalog');

 // Visual geometry and accessibility invariants at five responsive widths.
 const overlap=(a,b)=>Math.min(a.right,b.right)-Math.max(a.left,b.left)>2&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2;
 const lum=rgb=>{const v=rgb.match(/[\d.]+/g).slice(0,3).map(x=>Number(x)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2];};
 const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
 const fieldStyle=w.getComputedStyle($('search'));check(ratio(fieldStyle.borderTopColor,fieldStyle.backgroundColor)>=3,'input boundary contrast');
 check(ratio(fieldStyle.color,fieldStyle.backgroundColor)>=4.5,'input text contrast');
 for(const width of [320,390,768,1024,1440]){
   frame.width=String(width);await tick();await tick();
   check(d.documentElement.scrollWidth<=frame.clientWidth+2,'overflow '+width);
   const rects=Array.from(d.querySelectorAll('.node')).map(n=>n.getBoundingClientRect()),map=$('signal-map').getBoundingClientRect();
   rects.forEach((r,i)=>{check(r.height>=43&&r.width>=44,'node target '+width+' / '+i);check(r.left>=map.left-1&&r.right<=map.right+1&&r.top>=map.top-1&&r.bottom<=map.bottom+1,'node clipped '+width+' / '+i);for(let j=i+1;j<rects.length;j++)check(!overlap(r,rects[j]),'node overlap '+width+' / '+i+' / '+j);});
   for(const button of d.querySelectorAll('.scenario-buttons button,.filters button,.reader-open,.nav a')){const r=button.getBoundingClientRect();check(r.height>=43,'control target '+width+' / '+button.textContent);}
   const first=d.querySelector('.reader-open');first.click();const dialog=$('reader').getBoundingClientRect();
   check(dialog.left>=-1&&dialog.right<=frame.clientWidth+1&&dialog.height<=frame.clientHeight+1,'dialog viewport '+width);
   check(d.activeElement===$('reader-close'),'dialog initial focus '+width);
   $('reader-close').click();await tick();check(d.activeElement===first,'dialog focus return '+width);
 }
 check(d.querySelector('main#main')!==null&&d.querySelectorAll('h1').length===1,'semantic landmarks');
 if(w.matchMedia('(prefers-reduced-motion: reduce)').matches){
   check($('motion-toggle').disabled&&d.documentElement.dataset.motion==='paused','reduced motion control');
   check(w.getComputedStyle(d.querySelector('.orbital')).animationName==='none','reduced motion animation disabled');
 }


 // Living research: actual spatial sequence, persistent state and models.
 const rr=document.createElement('iframe');rr.title='Ruble test';rr.width='1280';rr.height='900';
 const loaded=new Promise(resolve=>rr.addEventListener('load',resolve,{once:true}));rr.src='ruble/detail.html';document.body.append(rr);await loaded;
 const rd=rr.contentDocument,rw=rr.contentWindow,r=id=>rd.getElementById(id);
 for(let i=0;i<40&&!rd.body.classList.contains('live-ready');i++)await tick();
 check(rd.body.classList.contains('live-ready')&&rd.body.dataset.modelsReady==='true','living canvas and models initialized');
 const mode=()=>r('live-stage').dataset.mode,shown=()=>rd.querySelectorAll('.live-node:not([hidden])').length;
 const next=()=>r('r-next').click();
 check(mode()==='start'&&shown()===0&&r('live-count').textContent.startsWith('01 /')&&r('r-next').textContent==='Начать →'&&r('step-label').textContent.includes('ВСТУПЛЕНИЕ'),'start fully renders with core only');next();check(mode()==='map'&&shown()===1,'adds exactly one node');next();check(mode()==='focus'&&!r('essence').hidden&&r('future').hidden,'focus essence');
 check(r('live-world').style.transform.includes('scale(1.16)'),'camera focus');check(rd.querySelectorAll('#essence [data-live-step]').length===1,'one link visible');const firstLink=rd.querySelector('#essence [data-live-step="0"]');next();check(rd.querySelectorAll('#essence [data-live-step]').length===2&&rd.querySelector('#essence [data-live-step="0"]')===firstLink,'second link added without replacing first');
 next();check(mode()==='return'&&shown()===1&&rd.querySelector('.live-node.complete'),'return preserves node');next();check(mode()==='map'&&shown()===2,'second branch added');next();check(!r('future').hidden,'future follows essence');
 r('show-all').click();check(mode()==='overview'&&shown()===2,'map shows cumulative nodes');r('show-all').click();check(mode()==='focus','resume focus');
 const route=(i,s=0)=>{r('live-chapters').click();rd.querySelector('[data-jump="'+i+'"]').click();for(let j=0;j<s;j++)next();};
 route(3);check(!r('use').hidden&&r('use').querySelector('.live-lens-body').contains(r('wallet-action')),'wallet mounted in selected lens');const walletValues=[r('wallet-balance').textContent];for(let i=0;i<3;i++){r('wallet-action').click();walletValues.push(r('wallet-balance').textContent)}check(r('wallet-balance').textContent==='650 ₽','ruble wallet purchase: '+walletValues.join(' → '));r('wallet-action').click();check(r('wallet-balance').textContent==='0 ₽'&&r('bank-balance').textContent.includes('650'),'ruble wallet refund');
 route(4,1);check(r('transfer-result').textContent.includes('750'),'ruble transfer fee');r('t-top').value='300000';r('t-top').dispatchEvent(new rw.Event('input',{bubbles:true}));check(r('transfer-result').textContent.includes('Недостаточно'),'ruble transfer limit');
 route(5,1);check(r('business-result').textContent.includes('Не окупается'),'ruble cash comparison');const old=r('business-result').textContent;r('b-period').value='2026';r('b-period').dispatchEvent(new rw.Event('change',{bubbles:true}));check(old!==r('business-result').textContent,'ruble business tariff year');
 r('b-ticket').value='-1';r('b-ticket').dispatchEvent(new rw.Event('input',{bubbles:true}));check(r('business-result').textContent.includes('Некорректный'),'ruble invalid input');r('b-ticket').value='1500';r('b-ticket').dispatchEvent(new rw.Event('input',{bubbles:true}));r('show-all').click();r('show-all').click();check(r('b-period').value==='2026','calculator state retained');
 route(7,1);for(let i=0;i<4;i++)r('flow-next').click();check(rd.querySelectorAll('[data-flow].lit').length===4,'ruble payment path');
 route(8,1);r('off-a').click();r('off-b').click();r('off-sync').click();check(r('off-result').textContent.includes('дефицит')&&r('off-result').textContent.includes('600'),'ruble offline reconciliation');r('off-reset').click();check(!r('off-a').disabled,'ruble offline reset');
 route(9,1);check(r('earn-result').textContent.includes('25'),'ruble income calculation');
 route(11);r('plan-0').click();check(r('plan-progress').textContent.startsWith('1 из 5'),'ruble personal plan');
 next();next();next();check(mode()==='final'&&shown()===12,'final whole map');
 check(rd.querySelectorAll('[data-faq-item]').length===51,'integrated questions preserved');rd.querySelector('a[href="#question-index"]').click();check(r('live-dialog').open,'search dialog');
 r('faq-search').value='айфон';r('faq-search').dispatchEvent(new rw.Event('input',{bubbles:true}));check(r('question-results').querySelector('a[href="#q-ios"]')&&!r('question-results').querySelector('a[href="#q-pension"]'),'question synonym search');r('question-results').querySelector('a[href="#q-ios"]').click();check(!r('engineering').hidden&&r('q-ios').open&&r('engineering').querySelector('.live-lens-head h3').textContent.includes('iPhone'),'question opens in same canvas');
 next();check(!r('engineering').hidden,'return to chain');route(0);check(rd.querySelectorAll('#essence [data-live-step]').length===2,'earlier chain retained');
 rd.querySelector('a[href="#sources"]').click();check(r('live-dialog').open&&r('live-dialog-body').contains(r('sources')),'source panel');r('live-dialog-close').click();await tick();
 const ff=document.createElement('iframe');ff.title='Legacy question link';ff.width='1280';ff.height='900';const loadedLegacy=new Promise(resolve=>{ff.addEventListener('load',()=>{if(ff.contentDocument?.getElementById('live-stage'))resolve()});});ff.src='ruble/questions/index.html#q-freeze';document.body.append(ff);await loadedLegacy;for(let i=0;i<30&&!ff.contentDocument?.getElementById('q-freeze')?.open;i++)await tick();const fd=ff.contentDocument;check(fd.getElementById('q-freeze')?.open&&!fd.getElementById('risks').hidden,'legacy link reaches question: '+fd.URL+' / '+fd.body.className+' / '+fd.getElementById('main')?.dataset.linkError+' / '+fd.getElementById('live-stage')?.dataset.mode);
 for(const width of [320,390,768,1024,1440]){rr.width=String(width);await tick();await tick();check(rd.documentElement.scrollWidth<=rr.clientWidth+2,'canvas overflow '+width);const lens=rd.querySelector('#essence .live-lens').getBoundingClientRect(),footer=r('r-navigation').getBoundingClientRect();check(lens.width>0&&lens.height>0&&lens.right<=rr.clientWidth+2&&lens.bottom<=footer.top+2,'focus panel visible '+width);r('show-all').click();await tick();check(mode()==='overview','overview '+width);check(rd.documentElement.scrollWidth<=rr.clientWidth+2,'overview overflow '+width);r('show-all').click();}

 const tf=document.createElement('iframe');tf.title='Visual talk';tf.width='1280';tf.height='900';const tl=new Promise(resolve=>tf.addEventListener('load',resolve,{once:true}));tf.src='ruble/index.html';document.body.append(tf);await tl;const td=tf.contentDocument,t=id=>td.getElementById(id);
 check(td.body.classList.contains('talk-ready'),'visual talk initialized');check(t('main').dataset.mode==='start','visual first');check(td.querySelectorAll('.talk-node:not([hidden])').length===0,'starts with core only');
 t('talk-next').click();check(t('main').dataset.mode==='scene'&&td.querySelectorAll('.talk-node:not([hidden])').length===1,'first visual node');
 const scene=td.querySelector('.talk-scene:not([hidden])');check(scene.dataset.revealCount==='1','first reveal');t('talk-next').click();check(scene.dataset.revealCount==='2'&&!scene.hidden,'second detail on same scene');t('talk-overview-button').click();check(t('main').dataset.mode==='overview','talk map');t('talk-overview-button').click();check(t('main').dataset.mode==='scene'&&scene.dataset.revealCount==='2','talk resume');
 for(const width of [320,390,768,1024,1440]){tf.width=String(width);await tick();check(td.documentElement.scrollWidth<=tf.clientWidth+2,'talk overflow '+width);const visual=td.querySelector('.talk-scene:not([hidden]) .talk-visual').getBoundingClientRect();check(visual.width>0&&visual.height>0,'talk visual '+width);}
 for(let i=0;i<100&&t('main').dataset.mode!=='final';i++)t('talk-next').click();check(t('main').dataset.mode==='final'&&td.querySelectorAll('.talk-node:not([hidden])').length===12,'talk final whole map');check(t('talk-deep').getAttribute('href')==='detail.html','detailed study after talk');
 out.textContent='PASS: portal browser interactions, five-width visual geometry, focus and contrast';
}
frame.addEventListener('load',()=>run().catch(e=>out.textContent='FAIL: '+e.message),{once:true});
</script></body></html>
